name: tracking-schedule

# Unattended cloud schedule independent of a laptop.
on:
  schedule:
    - cron: "30 22 * * *"   # daily ~06:30 SGT
    - cron: "0 0 * * 1"     # weekly Monday ~08:00 SGT
  workflow_dispatch:
    inputs:
      job:
        description: "daily or weekly"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly

jobs:
  daily:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data_sources/requirements.txt
          pip install -r requirements-dev.txt
      - name: Doctor
        env:
          TRACKING_ENV: production
        run: python -m data_sources.tracking.cli doctor --json
      - name: Daily collect
        env:
          TRACKING_ENV: production
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          GSC_CREDENTIALS_PATH: ${{ secrets.GSC_CREDENTIALS_PATH }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_PATH: ${{ secrets.GA4_CREDENTIALS_PATH }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          LARK_ALERT_WEBHOOK_URL: ${{ secrets.LARK_ALERT_WEBHOOK_URL }}
        run: python -m data_sources.tracking.cli daily --json

  weekly:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'weekly') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data_sources/requirements.txt
          pip install -r requirements-dev.txt
      - name: Weekly report (no publish unless TRACKING_WEEKLY_PUBLISH secret is true)
        env:
          TRACKING_ENV: production
          TRACKING_WEEKLY_PUBLISH: ${{ secrets.TRACKING_WEEKLY_PUBLISH }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          LARK_WEEKLY_TABLE_ID: ${{ secrets.LARK_WEEKLY_TABLE_ID }}
          LARK_OPPORTUNITIES_TABLE_ID: ${{ secrets.LARK_OPPORTUNITIES_TABLE_ID }}
          LARK_ALERT_WEBHOOK_URL: ${{ secrets.LARK_ALERT_WEBHOOK_URL }}
        run: bash ops/tracking/run-weekly.sh
