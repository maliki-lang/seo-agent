name: tracking-schedule

# Optional CI probe / manual dispatch.
# Approved durable production history is persistent VM disk + systemd (see ops/tracking/).
# GitHub Actions checkout SQLite is ephemeral and MUST NOT be treated as the primary database.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "daily or weekly (probe only unless durable store configured)"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly

jobs:
  daily:
    if: github.event.inputs.job == 'daily'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data_sources/requirements.txt
          pip install -r requirements-dev.txt
      - name: Materialize Google credentials and doctor
        env:
          TRACKING_ENV: production
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # Probe mode uses a workspace sqlite path and must not be treated as durable history.
          TRACKING_DATABASE_URL: sqlite:///data/tracking-ci-probe.db
        run: |
          bash ops/tracking/materialize-credentials.sh \
            python -m data_sources.tracking.cli doctor --json
      - name: Daily collect (probe only)
        env:
          TRACKING_ENV: production
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          LARK_ALERT_WEBHOOK_URL: ${{ secrets.LARK_ALERT_WEBHOOK_URL }}
          TRACKING_DATABASE_URL: sqlite:///data/tracking-ci-probe.db
        run: |
          bash ops/tracking/materialize-credentials.sh \
            python -m data_sources.tracking.cli daily --json

  weekly:
    if: github.event.inputs.job == 'weekly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data_sources/requirements.txt
          pip install -r requirements-dev.txt
      - name: Weekly report probe
        env:
          TRACKING_ENV: production
          TRACKING_WEEKLY_PUBLISH: ${{ secrets.TRACKING_WEEKLY_PUBLISH }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          LARK_WEEKLY_TABLE_ID: ${{ secrets.LARK_WEEKLY_TABLE_ID }}
          LARK_OPPORTUNITIES_TABLE_ID: ${{ secrets.LARK_OPPORTUNITIES_TABLE_ID }}
          LARK_ALERT_WEBHOOK_URL: ${{ secrets.LARK_ALERT_WEBHOOK_URL }}
          TRACKING_DATABASE_URL: sqlite:///data/tracking-ci-probe.db
        run: bash ops/tracking/run-weekly.sh
